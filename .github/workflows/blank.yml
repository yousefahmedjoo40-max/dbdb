name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8 (required by Forge 1.16.5)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      # No gradle-wrapper.jar needed: this action installs Gradle for us.
      - name: Set up Gradle 7.4.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.4.2'

      - name: Verify required assets
        run: gradle verifyAssets --no-daemon

      - name: Build mod jar
        run: gradle build --no-daemon --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: strangedecisions-jar
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: strangedecisions-jar
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
